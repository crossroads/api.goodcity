# The stock spine: designed cases, each with the reason it exists (`why`) and what the
# checks assert about it once built (`expect`). Delete a case only if you know what it
# was testing.
#
# Fields
#   code          real package type code (resolved by code, never id)
#   description   post-cleanup house style: sentence case, specific, key attributes
#   condition     New | Lightly Used | Heavily Used | Broken | Mixed      grade: A-D
#   qty           received quantity          value: HK$ (per unit)
#   dims          [length, width, height] in cm  (CBM is derived, never stored)
#   location      "<building> <area>", a real production location
#   inventoried   when it was received: "-40d", "-40d@14:30", "2018-06-12"
#   photos        fixture photo group held by the local image service (1-3 images)
#   history       what happened to it afterwards, performed through Package::Operations:
#                   move: <qty|all> to: <location> [from:]   gain|loss|trash|recycle: <qty>
#                   process: <qty> destination:   publish: true|false   set: {field: value}
#                   message: <staff note on the item>
#   Designations and dispatches live on the order side (orders.yml).

