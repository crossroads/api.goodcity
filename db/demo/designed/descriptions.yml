# Wording for filler stock, in the POST-cleanup house style Crossroads expects its
# cleanup agent to produce: sentence case, specific and accurate, key attributes present,
# consistent terminology across similar items, brand names only where natural. No emoji,
# no leading spaces, no "FOR <TAG>" earmarks inside descriptions.
#
# "{a|b|c}" picks one alternative. Codes not listed fall back to the package type's own
# name plus a generic qualifier.

