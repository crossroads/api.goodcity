# Filler order texture.
chat:
  purposes:
    - "Furniture for families moving into public housing"
    - "Supplies for our weekly community meal"
    - "Equipment for an after-school homework club"
    - "Household basics for asylum-seeker families"
    - "Bedding and kitchen items for elderly members living alone"
    - "Furnishing a new activity room"
    - "Items for a residential care home"
    - "Support for families on our casework list"
    - "Computers for job-seekers' training"
    - "Toys and books for a children's corner"
  requests:
    - "As discussed with the case worker"
    - "For a family of four"
    - "For our activity room"
    - "Any colour is fine"
    - "Sturdy enough for daily use"
    - "Small size preferred, the flat is tiny"
  buildings: ["Hoi Lai Estate, Block 3", "Lok Fu Estate, Wang Lok House", "Shek Kip Mei Estate, Block 12", "Choi Hung Estate, Kam Hung House", "Tin Shui Estate, Block 5", "Wah Fu Estate, Wah Hing House"]
  streets: ["Castle Peak Road", "Lung Cheung Road", "Tai Po Road", "King's Road", "Nathan Road", "Tuen Mun Road"]
  exchanges:
    - - { body: "Hello, can we come on Saturday instead?" }
      - { staff: true, body: "Saturday is fine, we are open until 1 pm." }
    - - { body: "Our driver's name is Mr Chan, he will bring the letter from the centre." }
      - { staff: true, body: "Thank you, noted." }
    - - { staff: true, body: "Please bring trolleys, the tables are heavy." }
      - { body: "Will do, thanks for the reminder." }
    - - { body: "Is the fridge still available? The family has been waiting." }
      - { staff: true, body: "Yes, it is designated to this order. See you on the day." }
    - - { staff: true, body: "The appointment is confirmed. Please come to the main gate and ask for the order desk." }

# Small sets for filler (members share a {finish}). Real production has ~2,000 sets.
sets:
  - code: FTD
    description: "Dining set, {finish}, table and chairs"
    finishes: ["oak veneer", "white", "walnut veneer", "solid rubberwood"]
    members:
      - { code: FTD, description: "Dining table, {finish}, four seats, 120 x 75 cm" }
      - { code: FCD, qty: [4, 6], description: "Dining chair, {finish}, padded seat" }
  - code: FDH
    description: "Study set, {finish}, desk and chair"
