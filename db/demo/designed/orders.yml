# The order spine. Each order is created in draft on `created` and then walked through
# the app's real state machine by its `events`, in time order with everything else in
# the dataset. Codes (GC-00001, S00001, C00001) are issued by the app, rising with date.
#
# Fields
#   type        appointment | online-order | shipment | carryout
#   by          charity user (people.yml) who placed a GoodCity order
#   handler     staff member who processes it (default: an order-fulfilment person)
#   purpose     organisation | client (client = a synthetic beneficiary is attached)
#   transport   { type: self|ggv, scheduled: <time>, vehicle:, address: {...} }
#   requests    goodcity_requests: [{ code, qty, description }]
#   events      [{ at, do, ... }] where do is one of
#                 submit start_processing finish_processing start_dispatching close
#                 reopen restart_process dispatch_later resubmit
#                 cancel (reason:, text:)   checklist (items: n = only the first n)
#                 designate (item:, qty:)   dispatch (item:, qty:)   undispatch (item:, to:)
#                 cancel_line (item:)       note (body:)  — the order's sticky staff note
#                 message (from:, body:, staff: true = staff chat, unread: true)
#   expect      what the checks assert: state, gate (checklist|close|approval), unread, reason

# --- Live now ----------------------------------------------------------------------

