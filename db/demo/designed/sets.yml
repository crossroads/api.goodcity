# Package sets. A set is ONE donated item with several packages — the app's own
# PackageSet watcher links them on receipt, exactly as production does.
#
# Why sets matter (Matt, 2026-09-22): don't break a set blind; members live in different
# places; sets are publishable as units and Crossroads may require the whole set be taken.
#
# Set-level fields (condition, grade, inventoried, published, donor) apply to every member
# unless the member overrides them. `code` is the set's own package type.

- key: dining_set_teak
  why: "the canonical set: spans two locations and is partly given away — splitting it must be visible"
  code: FTD
  description: "Teak dining set, six seats"
  condition: Lightly Used
  grade: B
  inventoried: -64d
  published: false
  donor: donor_fischer
  members:
    - key: dining_table
      code: FTD
      qty: 1
      description: "Dining table, teak, extendable, 1.8 m"
      value: 2200
      dims: [180, 90, 76]
      location: 30 Furniture
      expect: { designated: 1, locations: 1 }
    - key: dining_carvers
      code: FCD
      qty: 2
      description: "Carver dining chair, teak, with arms"
      value: 350
      dims: [58, 54, 92]
      location: PG Shed
      expect: { on_hand: 2, available: 2 }
    - key: dining_side_chairs
      code: FCD
      qty: 4
      description: "Side dining chair, teak"
      value: 300
      dims: [46, 52, 92]
      location: PG Shed
      expect: { dispatched: 2, on_hand: 2 }

